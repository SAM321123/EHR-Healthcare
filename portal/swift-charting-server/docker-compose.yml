version: "3"

services:
  node-app:
    build: .
    image: node-app
    ports:
      - "5002:5002"
    environment:
      - DB_HOST=host.docker.internal
      - DB_PORT=5433
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    networks:
      - node-network

  redis:
    image: redis:7
    container_name: swift-redis
    ports:
      - "6379:6379"
    networks:
      - node-network

networks:
  node-network:
    driver: bridge
